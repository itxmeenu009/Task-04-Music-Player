<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pulse — Music Player</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <div class="bg-orbs" aria-hidden="true">
    <span></span><span></span><span></span>
  </div>

  <div class="app">

    
    <main class="panel player-panel">

      <header class="topbar">
        <div class="brand">
          <span class="logo">♪</span>
          <span class="brand-name">Pulse</span>
        </div>
        <div class="viz-modes" id="vizModes">
          <button class="chip active" data-mode="0">Bars</button>
          <button class="chip" data-mode="1">Wave</button>
          <button class="chip" data-mode="2">Radial</button>
        </div>
      </header>

      <section class="stage">
        <div class="art-wrap" id="artWrap">
          <div class="art" id="art"></div>
        </div>
      </section>

      <canvas id="viz"></canvas>

      <section class="meta">
        <h1 id="title">Nothing playing</h1>
        <p id="artist">Add a song or pick a demo track</p>
      </section>

      <section class="progress-area">
        <div class="seek" id="seek">
          <div class="seek-buffer" id="seekBuffer"></div>
          <div class="seek-fill" id="seekFill"><span class="thumb"></span></div>
        </div>
        <div class="times">
          <span id="curTime">0:00</span>
          <span id="durTime">0:00</span>
        </div>
      </section>

      <section class="controls">
        <button class="btn ghost" id="shuffleBtn" title="Shuffle (S)" aria-label="Shuffle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="16 3 21 3 21 8"/>
            <line x1="4" y1="20" x2="21" y2="3"/>
            <polyline points="21 16 21 21 16 21"/>
            <line x1="15" y1="15" x2="21" y2="21"/>
            <line x1="4" y1="4" x2="9" y2="9"/>
          </svg>
        </button>

        <button class="btn" id="prevBtn" title="Previous (P)" aria-label="Previous">
          <svg viewBox="0 0 24 24">
            <path d="M18 6.2v11.6c0 .8-.9 1.3-1.6.9l-8.8-5.8a1 1 0 0 1 0-1.7l8.8-5.8c.7-.5 1.6 0 1.6.8zM4 6h2.2v12H4z"/>
          </svg>
        </button>

        <button class="btn play" id="playBtn" title="Play / Pause (Space)" aria-label="Play or pause">
          <svg viewBox="0 0 24 24">
            <path d="M8 5.1v13.8c0 .9 1 1.4 1.7.9l10.4-6.9a1.1 1.1 0 0 0 0-1.8L9.7 4.2C9 3.7 8 4.2 8 5.1z"/>
          </svg>
        </button>

        <button class="btn" id="nextBtn" title="Next (N)" aria-label="Next">
          <svg viewBox="0 0 24 24">
            <path d="M6 6.2v11.6c0 .8.9 1.3 1.6.9l8.8-5.8a1 1 0 0 0 0-1.7L7.6 5.4C6.9 5 6 5.4 6 6.2zM17.8 6H20v12h-2.2z"/>
          </svg>
        </button>

        <button class="btn ghost" id="repeatBtn" title="Repeat (R)" aria-label="Repeat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"/>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
            <polyline points="7 23 3 19 7 15"/>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
          </svg>
        </button>
      </section>

      <section class="extras">
        <button class="btn ghost" id="muteBtn" title="Mute (M)" aria-label="Mute">
          <svg id="volIcon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M11 5 6 9H3v6h3l5 4V5z"/>
            <path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
            <path d="M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>

        <input type="range" id="vol" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">

        <button class="btn ghost" id="favBtn" title="Like" aria-label="Like">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>
          </svg>
        </button>
      </section>
    </main>

    <!-- ==================== LIBRARY ==================== -->
    <aside class="panel library">
      <div class="lib-head">
        <h2>Library</h2>
        <span class="count" id="count">0</span>
      </div>

      <div class="search">
        <input id="searchInput" type="search" placeholder="Search songs or artists…"
               autocomplete="off" aria-label="Search">
      </div>

      <ul class="playlist" id="playlist"></ul>

      <div class="lib-foot">
        <label class="btn add">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/>
          </svg>
          Add music
          <input type="file" id="fileInput" accept="audio/*" multiple hidden>
        </label>
        <span class="hint">or drop audio files here</span>
      </div>
    </aside>
  </div>

  <div class="drag-overlay" id="dragOverlay">
    <span>Drop your audio files</span>
  </div>

  <script src="./js/player.js"></script>
</body>
</html>
